
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן אישי</title>
    <meta name="description" content="A personal calendar application in Hebrew. Features a monthly view, ability to add, edit, and delete events, and persists data using sdk.db.">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #e5e7eb;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .calendar-cell {
            background-color: #ffffff;
            min-height: 100px;
            padding: 0.5rem;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .calendar-cell:hover {
            background-color: #f9fafb;
        }

        .calendar-cell.other-month {
            background-color: #f9fafb;
            color: #9ca3af;
        }

        .calendar-cell.today {
            background-color: #eff6ff;
        }

        .event-item {
            background-color: #3b82f6;
            color: white;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            margin-top: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-item button {
            opacity: 0.7;
            transition: opacity 0.2s;
            margin-right: 0.5rem;
        }

        .event-item button:hover {
            opacity: 1;
        }

        /* Custom scrollbar to ensure it is visible */
        ::-webkit-scrollbar {
            height: 12px;
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Modal styling */
        #eventModal {
            display: none;
        }
        #eventModal.active {
            display: flex;
        }
    </style>
</head>
<body class="p-0 m-0 overflow-hidden">

    <div class="w-full h-screen bg-white overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="flex items-center justify-between p-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800" id="monthYearDisplay">טוען...</h1>
            <div class="flex space-x-2 space-x-reverse">
                <button id="prevMonthBtn" class="p-2 rounded-full hover:bg-gray-100 text-gray-600 transition-colors">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <button id="todayBtn" class="px-4 py-2 bg-blue-50 text-blue-600 font-medium rounded-lg hover:bg-blue-100 transition-colors">
                    היום
                </button>
                <button id="nextMonthBtn" class="p-2 rounded-full hover:bg-gray-100 text-gray-600 transition-colors">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
        </div>

        <!-- Scrollable X Container -->
        <div class="flex-1 overflow-x-auto overflow-y-hidden flex flex-col pb-2">
            <div class="min-w-[1100px] flex-1 flex flex-col">
                <!-- Days of Week Header -->
                <div class="grid grid-cols-7 gap-1 bg-gray-50 border-b border-gray-200 text-center py-3 text-sm font-semibold text-gray-600">
                    <div>ראשון</div>
                    <div>שני</div>
                    <div>שלישי</div>
                    <div>רביעי</div>
                    <div>חמישי</div>
                    <div>שישי</div>
                    <div>שבת</div>
                </div>

                <!-- Calendar Grid -->
                <div id="calendarGrid" class="calendar-grid flex-1 overflow-y-auto pb-4">
                    <!-- Cells generated by JS -->
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 flex items-center justify-center z-50">
            <div class="text-center">
                <i class="fas fa-spinner fa-spin text-3xl text-blue-500 mb-2"></i>
                <p class="text-gray-600">טוען אירועים...</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Event Modal -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800" id="modalTitle">הוסף אירוע</h2>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            
            <form id="eventForm" class="p-6 space-y-4">
                <input type="hidden" id="eventDateStr">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">תאריך</label>
                    <div id="modalDateDisplay" class="text-gray-900 bg-gray-50 p-2 rounded border border-gray-200"></div>
                </div>

                <div>
                    <label for="eventTitle" class="block text-sm font-medium text-gray-700 mb-1">כותרת האירוע</label>
                    <input type="text" id="eventTitle" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow" placeholder="הזן כותרת...">
                </div>

                <div class="pt-4 flex justify-end space-x-3 space-x-reverse">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">
                        ביטול
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm">
                        שמור אירוע
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State
        const PROJECT_MANAGEMENT_ARTIFACT_ID = '2f59833e-4ade-450b-9f5d-4d2c64ae5273';
        let currentDate = new Date();
        let events = [];
        let projectEvents = [];
        let isUserAuthenticated = false;

        // DOM Elements
        const calendarGrid = document.getElementById('calendarGrid');
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        const eventModal = document.getElementById('eventModal');
        const eventForm = document.getElementById('eventForm');
        const eventTitleInput = document.getElementById('eventTitle');
        const eventDateStrInput = document.getElementById('eventDateStr');
        const modalDateDisplay = document.getElementById('modalDateDisplay');

        // Hebrew Month Names
        const monthNames = [
            "ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
            "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
        ];

        // Format Date to YYYY-MM-DD
        function formatDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Format Date for display (DD/MM/YYYY)
        function formatDateForDisplay(dateStr) {
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }

        // Initialize App
        async function init() {
            const user = sdk.getUser();
            isUserAuthenticated = !!user;

            if (!isUserAuthenticated) {
                alert("Please log in to save events. Changes will not be persisted.");
            }

            // Watch for changes to events (including those from the project app)
            sdk.watch(null, 'events', (data) => {
                events = Array.isArray(data) ? data : [];
                renderCalendar();
            });

            await loadEvents();
            renderCalendar();
            setupEventListeners();
        }

        // Load Events from DB
        async function loadEvents() {
            loadingOverlay.classList.remove('hidden');
            try {
                if (isUserAuthenticated) {
                    const data = await sdk.db.get('events');
                    events = Array.isArray(data) ? data : [];
                } else {
                    events = []; // Fallback for unauthenticated users
                }
            } catch (error) {
                console.error("Failed to load events:", error);
                events = [];
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        // Save Events to DB
        async function saveEvents() {
            if (!isUserAuthenticated) return;
            
            try {
                // Optimistic update already handled in state
                await sdk.db.set('events', events);
            } catch (error) {
                console.error("Failed to save events:", error);
                alert("שגיאה בשמירת האירוע. אנא נסה שוב.");
                await loadEvents(); // Revert on failure
                renderCalendar();
            }
        }

        // Render Calendar Grid
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Set Header
            monthYearDisplay.textContent = `${monthNames[month]} ${year}`;

            // Get first day of month and total days
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            const totalDays = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay(); // 0 = Sunday

            const prevMonthLastDay = new Date(year, month, 0).getDate();

            // Render Previous Month Days
            for (let i = startingDayOfWeek - 1; i >= 0; i--) {
                const dayNum = prevMonthLastDay - i;
                const dateStr = formatDateString(new Date(year, month - 1, dayNum));
                createDayCell(dayNum, dateStr, true);
            }

            // Render Current Month Days
            const todayStr = formatDateString(new Date());
            for (let i = 1; i <= totalDays; i++) {
                const dateStr = formatDateString(new Date(year, month, i));
                createDayCell(i, dateStr, false, dateStr === todayStr);
            }

            // Render Next Month Days to fill grid (42 cells total for 6 rows)
            const totalCellsRendered = startingDayOfWeek + totalDays;
            const remainingCells = 42 - totalCellsRendered;
            
            for (let i = 1; i <= remainingCells; i++) {
                const dateStr = formatDateString(new Date(year, month + 1, i));
                createDayCell(i, dateStr, true);
            }
        }

        function createDayCell(dayNum, dateStr, isOtherMonth, isToday = false) {
            const cell = document.createElement('div');
            cell.className = `calendar-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} flex flex-col`;
            
            // Day Number
            const dayNumEl = document.createElement('div');
            dayNumEl.className = `text-sm font-semibold mb-1 ${isToday ? 'text-blue-600' : ''}`;
            dayNumEl.textContent = dayNum;
            cell.appendChild(dayNumEl);

            // Events Container
            const eventsContainer = document.createElement('div');
            eventsContainer.className = 'flex flex-col gap-1 overflow-y-auto flex-1';

            // Filter and render events for this day
            const allDayEvents = events.filter(e => e.date === dateStr);
            allDayEvents.forEach(event => {
                const eventEl = document.createElement('div');
                eventEl.className = 'event-item';
                if (event.color) {
                    eventEl.style.backgroundColor = event.color;
                }
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = event.title;
                titleSpan.className = 'truncate';
                
                eventEl.appendChild(titleSpan);
                
                // Click to edit
                eventEl.onclick = (e) => {
                    e.stopPropagation();
                    openEventModal(dateStr, event);
                };
                eventEl.style.cursor = 'pointer';

                if (!event.isProject) {
                    const delBtn = document.createElement('button');
                    delBtn.innerHTML = '<i class="fas fa-times"></i>';
                    delBtn.onclick = (e) => {
                        e.stopPropagation(); // Prevent opening cell modal
                        deleteEvent(event.id);
                    };
                    eventEl.appendChild(delBtn);
                } else {
                    // Small icon to indicate it's a project
                    const projIcon = document.createElement('i');
                    projIcon.className = 'fas fa-project-diagram opacity-70 ml-1 text-[10px]';
                    eventEl.prepend(projIcon);
                }
                eventsContainer.appendChild(eventEl);
            });

            cell.appendChild(eventsContainer);

            // Click to add event
            cell.addEventListener('click', () => openEventModal(dateStr));

            calendarGrid.appendChild(cell);
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Navigation
            document.getElementById('prevMonthBtn').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            document.getElementById('nextMonthBtn').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            document.getElementById('todayBtn').addEventListener('click', () => {
                currentDate = new Date();
                renderCalendar();
            });

            // Modal
            document.getElementById('closeModalBtn').addEventListener('click', closeEventModal);
            document.getElementById('cancelModalBtn').addEventListener('click', closeEventModal);
            
            eventForm.addEventListener('submit', handleEventSubmit);
        }

        // Modal Functions
        let editingEventId = null;

        function openEventModal(dateStr, event = null) {
            eventDateStrInput.value = dateStr;
            modalDateDisplay.textContent = formatDateForDisplay(dateStr);
            
            if (event) {
                editingEventId = event.id;
                eventTitleInput.value = event.title;
                document.getElementById('modalTitle').textContent = 'ערוך אירוע';
                
                // If it's a project event, disable editing title (edit in project app)
                if (event.isProject) {
                    eventTitleInput.disabled = true;
                    eventTitleInput.title = "לא ניתן לערוך שם פרויקט מהיומן";
                } else {
                    eventTitleInput.disabled = false;
                    eventTitleInput.title = "";
                }
            } else {
                editingEventId = null;
                eventTitleInput.value = '';
                eventTitleInput.disabled = false;
                eventTitleInput.title = "";
                document.getElementById('modalTitle').textContent = 'הוסף אירוע';
            }
            
            eventModal.classList.add('active');
            setTimeout(() => eventTitleInput.focus(), 100);
        }

        function closeEventModal() {
            eventModal.classList.remove('active');
            eventForm.reset();
            editingEventId = null;
        }

        async function handleEventSubmit(e) {
            e.preventDefault();
            
            const title = eventTitleInput.value.trim();
            const dateStr = eventDateStrInput.value;
            
            if (!title || !dateStr) return;

            if (editingEventId) {
                // Find and update existing event
                const index = events.findIndex(ev => ev.id === editingEventId);
                if (index !== -1 && !events[index].isProject) {
                    events[index].title = title;
                }
            } else {
                // Create new event
                const newEvent = {
                    id: crypto.randomUUID(),
                    title: title,
                    date: dateStr
                };
                events.push(newEvent);
            }

            // UI feedback
            renderCalendar();
            closeEventModal();

            // Persist
            await saveEvents();
        }

        async function deleteEvent(id) {
            if (!confirm('האם אתה בטוח שברצונך למחוק אירוע זה?')) return;

            // Optimistic update
            events = events.filter(e => e.id !== id);
            renderCalendar();

            // Persist
            await saveEvents();
        }

        // Start App
        init();

    </script>
</body>
</html>
